name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancel outdated runs on the same PR/branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  build-and-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shared/package-lock.json
            workers/package-lock.json
            api/package-lock.json

      - name: Build all packages (shared → workers → api)
        run: npm run build:all

      - name: Lint API
        run: cd api && npm run lint

      - name: Unit tests (API)
        run: cd api && npm test -- --passWithNoTests --ci

  docker-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: orchestrate-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/Dockerfile
          push: false
          tags: orchestrate-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify ffmpeg in worker image
        run: |
          docker run --rm orchestrate-worker:ci ffmpeg -version
          docker run --rm orchestrate-worker:ci ffprobe -version
