# DigitalOcean App Platform — Orchestrate API + all workers
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Storage note: App Platform has no shared disk between services.
# Use Path A (S3) for media/report outputs — set USE_S3=true and AWS secrets below.
# Local /processed_media URLs will NOT work across separate worker components.
name: orchestrate
region: nyc

x-s3-env: &s3_env
  - key: USE_S3
    value: "true"
  - key: AWS_ACCESS_KEY_ID
    scope: RUN_TIME
    type: SECRET
  - key: AWS_SECRET_ACCESS_KEY
    scope: RUN_TIME
    type: SECRET
  - key: AWS_REGION
    scope: RUN_TIME
    type: SECRET
  - key: S3_BUCKET
    scope: RUN_TIME
    type: SECRET

x-worker-env: &worker_env
  - key: NODE_ENV
    value: production
  - key: RUN_WORKERS_IN_API
    value: "true"
  - key: DB_HOST
    value: ${db.HOSTNAME}
  - key: DB_PORT
    value: ${db.PORT}
  - key: DB_USER
    value: ${db.USERNAME}
  - key: DB_PASS
    value: ${db.PASSWORD}
  - key: DB_NAME
    value: ${db.DATABASE}
  - key: REDIS_HOST
    value: ${redis.HOSTNAME}
  - key: REDIS_PORT
    value: ${redis.PORT}
  - key: METRICS_PORT
    value: "3001"
  - key: JOB_DEMO_DELAY_MS
    value: "0"
  - key: DB_SYNCHRONIZE
    value: "true"
  - key: CLEAN_TEMP_FILES
    value: "true"
  - key: HUNTER_SKIP_VERIFY
    value: "true"
  - <<: *s3_env

services:
  - name: api
    github:
      repo: basanta1-github/Orchestrate
      branch: main
      deploy_on_push: true
    dockerfile_path: api/Dockerfile
    source_dir: /
    http_port: 3001
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
    envs:
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NODE_ENV
        value: production
      - key: RUN_WORKERS_IN_API
        value: "true"
      - key: DB_HOST
        value: ${db.HOSTNAME}
      - key: DB_PORT
        value: ${db.PORT}
      - key: DB_USER
        value: ${db.USERNAME}
      - key: DB_PASS
        value: ${db.PASSWORD}
      - key: DB_NAME
        value: ${db.DATABASE}
      - key: REDIS_HOST
        value: ${redis.HOSTNAME}
      - key: REDIS_PORT
        value: ${redis.PORT}
      - key: QUEUE_DEPTH_POLLER
        value: "true"
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: CORS_ORIGIN
        value: ${api.PUBLIC_URL}
      - key: PUBLIC_API_URL
        value: ${api.PUBLIC_URL}
      - <<: *s3_env

  - name: media-worker
    github:
      repo: basanta1-github/Orchestrate
      branch: main
    dockerfile_path: workers/Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - <<: *worker_env
      - key: WORKER_TYPE
        value: media
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: FFPROBE_PATH
        value: /usr/bin/ffprobe

  - name: ml-worker
    github:
      repo: basanta1-github/Orchestrate
      branch: main
    dockerfile_path: workers/Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - <<: *worker_env
      - key: WORKER_TYPE
        value: ml

  - name: email-worker
    github:
      repo: basanta1-github/Orchestrate
      branch: main
    dockerfile_path: workers/Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - <<: *worker_env
      - key: WORKER_TYPE
        value: email

  - name: etl-worker
    github:
      repo: basanta1-github/Orchestrate
      branch: main
    dockerfile_path: workers/Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - <<: *worker_env
      - key: WORKER_TYPE
        value: etl

  - name: report-worker
    github:
      repo: basanta1-github/Orchestrate
      branch: main
    dockerfile_path: workers/Dockerfile
    source_dir: /
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - <<: *worker_env
      - key: WORKER_TYPE
        value: report

databases:
  - name: db
    engine: PG
    version: "15"
    production: false

  - name: redis
    engine: REDIS
    version: "7"
    production: false
