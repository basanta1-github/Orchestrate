apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: orchestrate
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Uncomment if GHCR images are private:
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/basanta1-github/orchestrate-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: orchestrate-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: orchestrate-secrets
                  key: JWT_SECRET
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: orchestrate-secrets
                  key: DB_PASS
          volumeMounts:
            - name: media-data
              mountPath: /app/shared/media
            - name: report-data
              mountPath: /app/shared/reports
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: media-data
          persistentVolumeClaim:
            claimName: media-data-pvc
        - name: report-data
          persistentVolumeClaim:
            claimName: report-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: orchestrate
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: orchestrate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
