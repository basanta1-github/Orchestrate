# Copy to secrets.yaml — NEVER commit secrets.yaml
#
#   Copy-Item k8s/secrets.example.yaml k8s/secrets.yaml
#   kubectl apply -f k8s/secrets.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: orchestrate-secrets
  namespace: orchestrate
type: Opaque
stringData:
  JWT_SECRET: change-me-use-openssl-rand-hex-32
  DB_PASS: postgres

  # Optional S3
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: ""
  S3_BUCKET: ""

  # Optional SMTP (email worker)
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USER: ""
  SMTP_PASS: ""

---
# Optional: pull private images from GHCR
# Create with:
#   kubectl create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=YOUR_GITHUB_USER \
#     --docker-password=YOUR_PAT \
#     -n orchestrate
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: ghcr-pull
#   namespace: orchestrate
# type: kubernetes.io/dockerconfigjson
# data:
#   .dockerconfigjson: <base64 docker config>
