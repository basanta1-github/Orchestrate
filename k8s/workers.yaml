# Worker Deployments — one per queue type, each with its own HPA
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-worker
  namespace: orchestrate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-worker
  template:
    metadata:
      labels:
        app: media-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/basanta1-github/orchestrate-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: orchestrate-config
          env:
            - name: WORKER_TYPE
              value: media
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: orchestrate-secrets
                  key: DB_PASS
          startupProbe:
            httpGet:
              path: /metrics/health
              port: 3001
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /metrics/health
              port: 3001
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics/health
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-worker-hpa
  namespace: orchestrate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
