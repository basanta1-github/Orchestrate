# Local K8s (Docker Desktop / Minikube): hostPath shared dirs when RWX PVC is unavailable.
# Deploy: kubectl apply -f k8s/namespace.yaml && kubectl apply -f k8s/secrets.yaml && kubectl apply -k k8s/overlays/local-storage
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../

patches:
  - path: hostpath-volumes-patch.yaml
