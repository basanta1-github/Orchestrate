services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      API_PORT: "3001"
      QUEUE_DEPTH_POLLER: "true"
      RUN_WORKERS_IN_API: "false"
      MEDIA_OUTPUT_DIR: "/app/shared/media"
      REPORT_OUTPUT_DIR: "/app/shared/reports"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - jobque_default
    volumes:
      - ./dashboard:/app/dashboard.ro
      - media_data:/app/shared/media
      - report_data:/app/shared/reports

  email-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    env_file: .env
    environment:
      WORKER_TYPE: email
      REDIS_HOST: redis
      DB_HOST: db
      METRICS_PORT: "3001"
      JOB_DEMO_DELAY_MS: "0"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - jobque_default

  etl-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    env_file: .env
    environment:
      WORKER_TYPE: etl
      REDIS_HOST: redis
      DB_HOST: db
      METRICS_PORT: "3001"
      JOB_DEMO_DELAY_MS: "0"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - jobque_default

  media-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    env_file: .env
    environment:
      WORKER_TYPE: media
      REDIS_HOST: redis
      DB_HOST: db
      METRICS_PORT: "3001"
      JOB_DEMO_DELAY_MS: "0"
      MEDIA_OUTPUT_DIR: "/app/shared/media"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - jobque_default
    volumes:
      - media_data:/app/shared/media

  ml-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    env_file: .env
    environment:
      WORKER_TYPE: ml
      REDIS_HOST: redis
      DB_HOST: db
      METRICS_PORT: "3001"
      JOB_DEMO_DELAY_MS: "0"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - jobque_default

  report-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    env_file: .env
    environment:
      WORKER_TYPE: report
      REDIS_HOST: redis
      DB_HOST: db
      METRICS_PORT: "3001"
      JOB_DEMO_DELAY_MS: "0"
      REPORT_OUTPUT_DIR: "/app/shared/reports"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - jobque_default
    volumes:
      - report_data:/app/shared/reports

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jobque_default

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_que
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_que"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobque_default

  prometheus:
    image: prom/prometheus:v2.51.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - jobque_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager-demo.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    networks:
      - jobque_default
    restart: unless-stopped
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:10.4.0
    profiles: ["monitoring"]
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - jobque_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  media_data:
  report_data:

networks:
  jobque_default:
    name: jobque_default
    driver: bridge