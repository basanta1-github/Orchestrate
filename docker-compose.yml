services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3001:3001"
    expose:
      - "3001"
    env_file: .env
    depends_on:
       redis:
        condition: service_healthy
       db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jobque_default

  email-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    # command: node dist/email-worker/worker.js
    command: node dist/main.js
    env_file:
      - .env
    environment:
      - WORKER_TYPE=email
      - REDIS_HOST=redis
      - METRICS_PORT=3001
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jobque_default
    restart: unless-stopped

  etl-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command:  node dist/main.js
    env_file:
      - .env
    environment:
      - WORKER_TYPE=etl
      - REDIS_HOST=redis
      - METRICS_PORT=3001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jobque_default

  media-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: node dist/main.js
    # working_dir: /app/workers
    env_file:
      - .env
    environment:
      - WORKER_TYPE=media
      - REDIS_HOST=redis
      - METRICS_PORT=3001
    depends_on:
       redis:
        condition: service_healthy
    restart: unless-stopped?
    networks:
      - jobque_default

  ml-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: node dist/main.js
    env_file:
      - .env
    environment:
      - WORKER_TYPE=ml
      - REDIS_HOST=redis
      - METRICS_PORT=3001
    depends_on:
      redis: 
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jobque_default

  report-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    command: node dist/main.js
    env_file:
      - .env
    environment:
      - WORKER_TYPE=report
      - REDIS_HOST=redis
      - METRICS_PORT=3001
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jobque_default
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jobque_default

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_que
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_que"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobque_default

volumes:
  db_data:
  redis_data:

networks:
  jobque_default:
    name: jobque_default
    driver: bridge
