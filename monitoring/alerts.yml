groups:
  - name: availability
    interval: 30s
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Target down — {{ $labels.job }} / {{ $labels.instance }}"
          description: >
            Prometheus cannot scrape {{ $labels.instance }} (job={{ $labels.job }})
            for over 1m. Process may be down.

  - name: job_failures
    interval: 30s
    rules:
      - alert: HighJobFailureRate
        expr: job:failure_ratio:5m > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High job failure rate on {{ $labels.queue }}"
          description: "Failure ratio {{ $value | humanizePercentage }} on {{ $labels.queue }} (threshold 5%)."

      - alert: CriticalJobFailureRate
        expr: job:failure_ratio:5m > 0.20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL failure rate on {{ $labels.queue }}"
          description: "Over 20% of jobs failing on {{ $labels.queue }}. Immediate action required."

      - alert: HighJobRetryRate
        expr: job:retry_ratio:5m > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High retry rate on {{ $labels.queue }}"
          description: "Retry ratio {{ $value | humanizePercentage }} on {{ $labels.queue }}. Investigate flaky processing."

  - name: dlq_alerts
    interval: 60s
    rules:
      - alert: DLQGrowing
        expr: sum by (queue) (rate(jobque_dlq_jobs_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DLQ growing for {{ $labels.queue }}"
          description: "Jobs are being moved to the DLQ for {{ $labels.queue }} (~{{ $value | humanize }}/s over 10m)."

      - alert: DLQDepthHigh
        expr: jobque_dlq_depth > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DLQ depth high for {{ $labels.queue }}"
          description: "{{ $value }} jobs in DLQ for {{ $labels.queue }}. Review and replay or discard."

      - alert: DLQDepthCritical
        expr: jobque_dlq_depth > 100
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL DLQ depth for {{ $labels.queue }}"
          description: "{{ $value }} jobs in DLQ. Systematic failure suspected. Escalate immediately."

  - name: worker_health
    interval: 30s
    rules:
      - alert: WorkerHeartbeatMissing
        expr: (time() - jobque_worker_heartbeat_timestamp) > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Worker heartbeat missing — {{ $labels.worker_type }} ({{ $labels.instance }})"
          description: >
            {{ $labels.worker_type }} worker ({{ $labels.instance }}) has not emitted
            a heartbeat in over 60s. Event loop may be blocked or the process is dead.

      - alert: WorkerHighMemory
        expr: jobque_nodejs_process_resident_memory_bytes > 1.5e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Worker high memory — {{ $labels.worker_type }} ({{ $labels.instance }})"
          description: "{{ $labels.instance }} using {{ $value | humanize1024 }}B RSS. Possible memory leak."

      - alert: WorkerHighCPU
        expr: rate(jobque_nodejs_process_cpu_seconds_total[5m]) * 100 > 90
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Worker high CPU — {{ $labels.worker_type }} ({{ $labels.instance }})"
          description: "{{ $labels.instance }} CPU at {{ $value | humanize }}%. Consider scaling out."

      - alert: WorkerEventLoopLagHigh
        expr: jobque_nodejs_nodejs_eventloop_lag_p99_seconds > 0.2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Event loop lag high — {{ $labels.worker_type }} ({{ $labels.instance }})"
          description: "p99 event-loop lag is {{ $value }}s on {{ $labels.instance }}. Process is saturated."

      - alert: NoWorkersForQueue
        expr: jobque_worker_count == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No workers running for {{ $labels.queue }}"
          description: "Queue {{ $labels.queue }} has 0 active workers. Jobs accumulating."

  - name: queue_health
    interval: 30s
    rules:
      - alert: QueueDepthHigh
        expr: jobque_queue_depth{state="waiting"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} has {{ $value }} waiting jobs"
          description: "More than 1000 jobs waiting. Autoscaler may need higher MAX_WORKERS."

      - alert: JobWaitTimeTooHigh
        expr: job:wait_seconds:p95:5m > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Jobs waiting too long in {{ $labels.queue }}"
          description: "P95 wait time is {{ $value }}s (threshold 120s). Review worker capacity."

      - alert: JobProcessingSlowP95
        expr: job:duration_seconds:p95:5m > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Job processing slow in {{ $labels.queue }}"
          description: "P95 duration is {{ $value }}s. Investigate."

  - name: tenant_cap
    interval: 60s
    rules:
      - alert: TenantFrequentCapHits
        expr: rate(jobque_tenant_cap_hit_total[10m]) > 0.5
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} frequently hitting cap"
          description: "Consider raising MAX_CONCURRENT_PER_TENANT for this tenant."

      - alert: TenantStagingBacklogHigh
        expr: jobque_tenant_staged_jobs > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} staging backlog high"
          description: "{{ $value }} jobs staged (cap-blocked) for tenant {{ $labels.tenant_id }}."

  - name: api_health
    interval: 30s
    rules:
      - alert: APIHighErrorRate
        expr: http:error_ratio:5m > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API error rate > 1% on {{ $labels.route }}"
          description: "{{ $value | humanizePercentage }} 5xx errors on {{ $labels.route }}."

      - alert: APIHighLatencyP95
        expr: http:duration_seconds:p95:5m > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency > 2s on {{ $labels.route }}"
          description: "P95 response time is {{ $value }}s on {{ $labels.route }}."
